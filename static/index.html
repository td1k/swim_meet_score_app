<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Swim Meet Scorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <div id="app" class="container-fluid">
      <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
          <h1 class="h3 mb-0">Swim Meet Scorer</h1>
          <nav class="mt-2">
            <button id="meetsBtn" class="btn btn-outline-light me-2">Meets</button>
            <button id="createBtn" class="btn btn-outline-light me-2">Create Meet</button>
            <button id="configBtn" class="btn btn-outline-light me-2">Configure</button>
            <button id="resultsBtn" class="btn btn-outline-light me-2">Results Entry</button>
            <button id="detailsBtn" class="btn btn-outline-light me-2">Details</button>
            <button id="summaryBtn" class="btn btn-outline-light">Summary</button>
          </nav>
        </div>
      </header>
      <main id="main" class="container"></main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
