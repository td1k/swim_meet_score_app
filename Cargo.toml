[package]
name = "swim_meet_score_app"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-files = "0.6"
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
env_logger = "0.10"
rusqlite = { version = "0.28", features = ["bundled"] }
tokio-rusqlite = "0.3"
